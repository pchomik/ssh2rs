[package]
name = "ssh2rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ssh2rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
russh = "0.64.1"
ssh2 = "0.9.6"
thiserror = "2.0.21"

[dependencies.tokio]
version = "1.53.3"
features = ["rt-multi-thread", "sync", "time", "macros"]

[dependencies.pyo3]
version = "0.29.3"
features = ["auto-initialize"]
