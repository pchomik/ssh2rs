[package]
name = "ssh2rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ssh2rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
russh = "0.64.1"
thiserror = "2.0.21"
pyo3-async-runtimes = { version = "0.29.0", features = [
    "attributes",
    "tokio-runtime",
] }
tokio = { version = "1.53.3", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "io-std",
] }
pyo3 = "0.29.3"
