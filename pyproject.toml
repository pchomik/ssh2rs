[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "ssh2rs"
version = "0.1.0"
authors = [{ name = "Pawel Chomicki", email = "pawel.chomicki@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ssh", "ssh2", "rust"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Topic :: System :: Shells",
]

[project.urls]
Documentation = "https://pchomik.ovh/docs/ssh2rs/about"
Changelog = "https://github.com/pchomik/ssh2rs/CHANGES.txt"
Repository = "https://github.com/pchomik/ssh2rs"
Issues = "https://github.com/pchomik/ssh2rs/issues"

[tool.maturin]
python-source = "python"
module-name = "ssh2rs.ssh2rs"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
dev = ["ruff>=0.17.1", "ty>=0.0.89"]
